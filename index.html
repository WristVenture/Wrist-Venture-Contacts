<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact — Wrist Venture</title>
<style>
body { text-align:center; font-family: Arial; padding:50px; background:#f2f2f2; }
.card { background:#fff; padding:25px; border-radius:12px; width:90%; max-width:420px; margin:auto; box-shadow:0 5px 16px rgba(0,0,0,0.18);}
h1 { margin-bottom:8px; }
p { font-size:19px; margin-top:5px; }
button {
  width:100%; padding:15px; margin-top:20px;
  background:#ff6a00; color:white; font-size:20px;
  border:none; border-radius:10px; cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
  <h1>Wrist Venture</h1>
  <p>📞 7698941213</p>

  <button id="saveBtn">➕ Save Contact</button>
</div>

<script>
document.getElementById("saveBtn").onclick = function () {
  let isAndroid = /Android/i.test(navigator.userAgent);
  if (isAndroid) {
    window.location.href =
"content://com.android.contacts/contacts/create?name=Wrist%20Venture&phone=7698941213";
  } else {
    window.location.href = "WristVenture.vcf";
  }
};
</script>

</body>
</html>
